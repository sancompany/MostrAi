<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha conta · TICK</title>
  <meta name="description" content="Entre ou crie sua conta TICK para comprar e ver seus ingressos.">
  <meta name="robots" content="noindex">
  <!-- Versão dos Termos/Política que esta página mostra e o aceite manda. -->
  <meta name="tick-termos" content="{{versao}}">
  <link rel="icon" href="/ticket/img/trimundi-icone.png" sizes="64x64" type="image/png">
  <meta name="theme-color" content="#0a0b0e">
  <link rel="stylesheet" href="/ticket/ticket.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/tic/eventos" aria-label="TICK — eventos"><img src="/ticket/img/trimundi-logo.webp" alt="" width="36" height="36">TICK</a>
    <span id="topoConta"></span>
  </header>

  <main id="conteudo" class="pagina estreita" aria-live="polite">
    <p class="carregando">Carregando...</p>
  </main>

  <footer class="rodape">
    <p><a href="/ticket/termos">Termos de Uso</a> · <a href="/ticket/privacidade">Política de Privacidade</a></p>
    <p>Ingressos TICK. O pagamento é feito no San Checkout, em ambiente seguro.</p>
    <p class="operadora">{{operadora}}</p>
  </footer>

  <script src="/ticket/comum.js"></script>
  <script src="/ticket/conta.page.js"></script>
</body>
</html>
