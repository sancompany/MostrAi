<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/img/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <title>Admin da Mostraí</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin/index.css">
  <link rel="canonical" href="https://mostrai.sancocore.com.br/admin/index.html">
  <meta name="theme-color" content="#ff7a1a">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="robots" content="noindex">
</head>
<body>
  <div id="gate" class="wrap gate">
    <div class="u-ta-c u-mb-18">
      <img class="u-h-30" src="/img/logo-mostrai-wordmark.png" alt="Mostraí">
      <p class="eyebrow u-m-0 u-mt-8">Painel administrativo</p>
    </div>
    <form class="card" id="formLogin">
      <div>
        <label for="usuario">Usuário</label>
        <input id="usuario" required autocomplete="username">
      </div>
      <div>
        <label for="senha">Senha</label>
        <input id="senha" type="password" required autocomplete="current-password">
      </div>
      <button class="btn primary block" type="submit">Entrar</button>
      <p class="form-msg" id="gateMsg"></p>
    </form>
  </div>

  <div id="app" class="admin-shell" hidden>
    <aside class="admin-side">
      <div class="marca">
        <img src="/img/logo-mostrai-wordmark.png" alt="Mostraí">
        <button class="btn ghost mini" id="btnLogout">Sair</button>
      </div>
      <div class="nav-lista" id="nav"></div>
    </aside>
    <main class="admin-main">
      <div class="admin-topo">
        <div class="admin-topo-texto">
          <div id="migalhaTopo" hidden></div>
          <h2 id="tituloSecao">Visão geral</h2>
          <p class="sub" id="subSecao"></p>
        </div>
        <button class="btn ghost mini" id="btnRecarregar">Atualizar</button>
      </div>
      <div id="conteudo">Carregando...</div>
    </main>
  </div>

  <script src="/config.js"></script>
  <script src="/admin/index.page.js"></script>
</body>
</html>
