<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/img/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <title>Esqueci minha senha na Mostraí</title>
  <meta name="description" content="Recupere o acesso à sua conta Mostraí.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mostraí">
  <meta property="og:title" content="Esqueci minha senha na Mostraí">
  <meta property="og:description" content="Recupere o acesso à sua conta Mostraí.">
  <meta property="og:url" content="https://mostrai.sancocore.com.br/esqueci-senha.html">
  <meta property="og:image" content="https://mostrai.sancocore.com.br/img/logo-mostrai-full.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <link rel="canonical" href="https://mostrai.sancocore.com.br/esqueci-senha.html">
  <meta name="theme-color" content="#ff7a1a">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="robots" content="noindex">
</head>
<body data-layout="minimo" data-layout-botao="Voltar ao site|/">

  <main>
    <section class="tight u-ta-c">
      <div class="wrap">
        <p class="eyebrow">Acesso</p>
        <h1 class="u-fs-220">Vamos recuperar sua conta</h1>
        <p class="lead u-m-0 u-centro">Informe o e-mail cadastrado e a gente manda um link pra você criar uma senha nova. O link vale por uma hora.</p>
      </div>
    </section>

    <section class="tight">
      <div class="wrap">
        <form class="card" id="formEsqueci">
          <div>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <button class="btn primary block" type="submit">Enviar link de recuperação</button>
          <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
          <p class="u-ta-c u-m-0 u-mt-12"><a class="link-secundario" id="voltarLogin" href="/anunciante/login.html">Voltar ao login</a></p>
        </form>
      </div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/layout.js"></script>
  <script src="/esqueci-senha.page.js"></script>
</body>
</html>
