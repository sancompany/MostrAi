<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{titulo}} · Ingressos</title>
  <meta name="description" content="{{descricao}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mostraí">
  <meta property="og:title" content="{{titulo}}">
  <meta property="og:description" content="{{descricao}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{imagem}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{url}}">
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <meta name="theme-color" content="#ff7a1a">
  <link rel="stylesheet" href="/ticket/ticket.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/"><img src="/img/logo-mostrai-wordmark.png" alt="Mostraí" height="26"></a>
    <a class="discreto" href="/ticket/recuperar">Já comprei</a>
  </header>

  <main id="conteudo" class="pagina" aria-live="polite">

    <p>Ingressos vendidos pela Mostraí. O pagamento é feito no San Checkout, em ambiente seguro.</p>

  <script src="/ticket/comum.js"></script>
  <script src="/ticket/edicao.page.js"></script>

</html>
