<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon-sanco.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <title>Nova senha na Mostraí</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Defina uma nova senha para sua conta Mostraí.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mostraí">
  <meta property="og:title" content="Nova senha na Mostraí">
  <meta property="og:description" content="Defina uma nova senha para sua conta Mostraí.">
  <meta property="og:url" content="https://mostrai.sancocore.com.br/redefinir-senha.html">
  <meta property="og:image" content="https://mostrai.sancocore.com.br/img/logo-mostrai-full.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <link rel="canonical" href="https://mostrai.sancocore.com.br/redefinir-senha.html">
  <meta name="theme-color" content="#ff7a1a">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="robots" content="noindex">
</head>
<body data-layout="minimo" data-layout-botao="Voltar ao site|/">

  <main>
    <section class="tight u-ta-c">
      <div class="wrap">
        <p class="eyebrow">Acesso</p>
        <h1 class="u-fs-220">Crie sua senha nova</h1>
        <p class="lead u-m-0 u-centro">Escolha uma senha de no mínimo 8 caracteres, com maiúscula, minúscula, número e símbolo. Depois disso é só entrar normalmente.</p>
      </div>
    </section>

    <section class="tight">
      <div class="wrap">
        <form class="card" id="formSenha">
          <div>
            <label for="senha">Nova senha</label>
            <input id="senha" type="password" data-senha data-senha required>
          </div>
          <div>
            <label for="senha_confirma">Confirmar nova senha</label>
            <input id="senha_confirma" type="password" data-senha data-senha-confirma required>
          </div>
          <button class="btn primary block" type="submit">Salvar senha</button>
          <p class="form-msg" id="msg"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/layout.js"></script>
  <script src="/formulario.js"></script>
  <script src="/redefinir-senha.page.js"></script>
</body>
</html>
