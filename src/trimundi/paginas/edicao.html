<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{titulo}} · TICK</title>
  <meta name="description" content="{{descricao}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TICK">
  <meta property="og:title" content="{{titulo}}">
  <meta property="og:description" content="{{descricao}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{imagem}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{url}}">
  <link rel="icon" href="/ticket/img/trimundi-icone.png" sizes="64x64" type="image/png">
  <meta name="theme-color" content="#0a0b0e">
  <link rel="stylesheet" href="/ticket/ticket.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/tic/eventos" aria-label="TICK — eventos"><img src="/ticket/img/trimundi-logo.webp" alt="" width="36" height="36">TICK</a>
    <a class="btn-conta" href="/ticket/conta">Minha conta</a>
  </header>

  <main id="conteudo" class="pagina" aria-live="polite">
    <p class="carregando">Carregando...</p>
  </main>

  <footer class="rodape">
    <p><a href="/ticket/termos">Termos de Uso</a> · <a href="/ticket/privacidade">Política de Privacidade</a></p>
    <p>Ingressos TICK. O pagamento é feito no San Checkout, em ambiente seguro.</p>
    <p>Dúvidas sobre o evento: fale com quem organiza. Seus ingressos ficam em <a href="/ticket/conta">Minha conta</a>.</p>
  </footer>

  <script src="/ticket/comum.js"></script>
  <script src="/ticket/edicao.page.js"></script>
</body>
</html>
