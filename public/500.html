<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon-sanco.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <title>Erro no servidor — Mostraí</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ff7a1a">
  <!-- HTML estático que NÃO depende da aplicação: é justamente quando ela
       falhou que esta página precisa abrir. Sem layout.js, sem config.js,
       sem fetch. O estilo vem do mesmo style.css, que é arquivo servido. -->
  <link rel="stylesheet" href="/style.css">
  <link rel="canonical" href="https://mostrai.sancocore.com.br/500.html">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <main>
    <section class="tight">
      <div class="wrap u-ta-c u-mw-texto">
        <p class="eyebrow">Erro 500</p>
        <h1>Alguma coisa falhou do nosso lado</h1>
        <p class="lead">Não foi você. O erro foi registrado e já estamos sabendo.</p>
        <p class="u-mt-24">
          <a class="btn primary" href="/">Tentar de novo</a>
        </p>
        <p class="form-hint u-mt-24">
          Se era um pagamento, <b>nada foi cobrado duas vezes</b> — o sistema
          confere isso sozinho. Precisando falar com alguém:
          <a href="https://wa.me/5516994635946?text=Ol%C3%A1!%20Tive%20um%20erro%20no%20site%20da%20Mostra%C3%AD." data-wa="Olá! Tive um erro no site da Mostraí.">WhatsApp</a>.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
