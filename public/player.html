<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mostraí Player</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/player.css">
  <link rel="canonical" href="https://mostrai.sancocore.com.br/player.html">
  <meta name="theme-color" content="#ff7a1a">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="robots" content="noindex">
</head>
<body>
<div id="stage">
  <video id="player" muted playsinline preload="auto"></video>
  <!-- Entre a instalação da primeira tela e o primeiro anúncio no ar passam
     semanas — e nesse período a tela do comércio mostrava só uma lâmpada
     apagada a 50% sobre preto, que lê como aparelho quebrado. É a vitrine
     mais visível que a Mostraí tem: quem está na fila do caixa olha pra ela.
     Agora é uma peça de verdade, no formato da tela. -->
  <div id="vazio">
    <div class="vazio-cartao">
      <img class="vazio-simbolo" src="/img/simbolo-mostrai.svg" alt="">
      <p class="vazio-marca">Mostraí</p>
      <p class="vazio-titulo">Este espaço pode ser do seu negócio.</p>
      <p class="vazio-linha">Anuncie nas telas do comércio de Matão</p>
      <!-- Telefone e QR entraram em 17/09/2026 (item 25). A peça só dizia o
           endereço do site, e ninguém digita URL olhando pra uma TV do outro
           lado do balcão. O QR é a única forma de agir na hora; o telefone é
           pra quem não usa QR. Os dois juntos, porque a tela é vista de longe
           e de perto. -->
      <div class="vazio-acao">
        <img class="vazio-qr" src="/img/qr-site.svg" alt="QR code para mostrai.sancocore.com.br">
        <div class="vazio-acao-texto">
          <p class="vazio-contato">(16) 99463-5946</p>
          <p class="vazio-site">mostrai.sancocore.com.br</p>
        </div>
      </div>
      <p class="vazio-aviso">Sem conexão no momento — os anúncios voltam assim que a internet voltar.</p>
    </div>
  </div>
</div>
<div id="msg"></div>
<div id="alvoPainel"></div>

<script src="/config.js"></script>
<script src="/player.page.js"></script>
</body>
</html>
