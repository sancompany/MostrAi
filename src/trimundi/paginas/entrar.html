<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar na portaria · Trimundi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/ticket/img/trimundi-icone.png" sizes="64x64" type="image/png">
  <meta name="theme-color" content="#0a0b0e">
  <link rel="stylesheet" href="/ticket/ticket.css">
</head>
<body>
  <header class="topo">
    <span class="marca"><img src="/ticket/img/trimundi-logo.webp" alt="" width="36" height="36">Trimundi</span>
    <span class="discreto">Portaria</span>
  </header>

  <main class="pagina estreita">
    <h1>Entrar na portaria</h1>
    <p>Acesso de operador de check-in. A conta é criada por quem organiza o evento.</p>
    <form class="cartao" id="formEntrar" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="200" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" maxlength="200" required>
      </div>
      <p class="mensagem" id="msg" role="status" aria-live="polite"></p>
      <button class="btn primario grande" type="submit">Entrar</button>
    </form>
    <p class="discreto">Primeiro acesso? <a href="/ticket/ativar">Ative com o código que você recebeu</a>.</p>
  </main>

  <footer class="rodape">
    <p><a href="/ticket/termos">Termos de Uso</a> · <a href="/ticket/privacidade">Política de Privacidade</a></p>
  </footer>

  <script src="/ticket/comum.js"></script>
  <script src="/ticket/entrar.page.js"></script>
</body>
</html>
